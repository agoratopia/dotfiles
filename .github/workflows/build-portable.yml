name: Build portable Neovim

# Produces the self-contained Neovim bundle documented in the README, for
# dropping onto a Linux server over SSH.
#
# Both architectures build natively rather than one under QEMU: this bundle
# compiles treesitter parsers from source, and emulated toolchains have already
# proven slow and unreliable for this repo.

# Rebuilds whenever the Neovim config changes, so the published bundle can't
# drift from the config in this repo. The result is republished under the
# rolling `portable-latest` tag, which is what nvim-go.sh downloads — edit the
# config, push, and the next `curl | sh` on a server picks it up.
on:
  push:
    branches: [main]
    paths:
      - '.config/nvim/**'
      - '.config/dotfiles/build-portable.sh'
      - '.config/dotfiles/nvim-go.sh'
      - '.github/workflows/build-portable.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish under this tag instead of portable-latest (e.g. portable-v1, to pin a known-good build).'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The runners already ship git, curl, jq, node and npm; these are the
      # ones that are not guaranteed.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential xz-utils binutils

      - name: Build
        run: .config/dotfiles/build-portable.sh --out dist

      - name: Show what was built
        run: |
          ls -la dist
          tar xzf dist/nvim-portable-${{ matrix.arch }}.tar.gz -O nvim-portable/BUILD-INFO

      - uses: actions/upload-artifact@v4
        with:
          name: nvim-portable-${{ matrix.arch }}
          path: dist/nvim-portable-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'portable-latest' }}
          ROLLING: ${{ inputs.tag == '' }}
        run: |
          set -euo pipefail
          ls -la dist
          # nvim-go.sh ships alongside the tarballs so the README one-liner can
          # curl it straight out of the release.
          cp .config/dotfiles/nvim-go.sh dist/

          # The rolling release is replaced rather than updated in place, so its
          # tag always points at the commit the bundle was actually built from.
          # A pinned version tag is only ever added to.
          if [ "$ROLLING" = "true" ]; then
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Portable Neovim ($TAG)" \
              --notes "Self-contained Neovim for Linux servers, built from \`${GITHUB_SHA:0:7}\`.
          Rebuilt automatically whenever the Neovim config changes, so it never drifts from this repo.

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/nvim-go.sh | sh
          \`\`\`

          Requires glibc 2.34+ (Ubuntu 22.04+, Debian 12+, RHEL/Rocky 9+). See the README."
          fi
